<!DOCTYPE html>
<html>
<head>
<title>CSS-Texto e Estilo de Fonte</title>
<style>
    h1 {
        color: green;
        text-decoration: overline;
        font-size: large 5px;
        font-family:cursive;
        font-style: oblique;
        font-weight: 1000;
        text-transform: uppercase;
        text-shadow: #fC0 10px 0 20px;
        text-align: center;
        line-height: 1.6;
        letter-spacing: 4px;
        word-spacing:  4px;
        line-height-step: unset;
       
    }
    <h2 {
        color: red;
        text-decoration: underline;
        text-decoration-thickness: 5px;
        text-decoration-color: red;
        font-family: cursive;
    }
    h3 {
        color: purple;
        text-decoration: line-through;
        font-family: 'Courier New', Courier, monospace;
        text-transform: capitalize;
    }
    h4 {
        color: brown;
        text-decoration: overline underline;
        font-family: Arial, Helvetica, sans-serif;
        
    }
</style>
</head>
<body>
<h1>Teste hehe</h1><i class="fa-solid fa-coffin-cross"></i>
<h2>Opa</h2><i class="fa-solid fa-coffin-cross"></i>
<h3>Hello world</h3>
<h4>Exemplo</h4>
<p> icones
<i class="fa-solid fa-coffin-cross"></i>
</p>
</body>
</html>
